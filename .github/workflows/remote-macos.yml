name: Remote desktop macOS package

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/remote-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.21.1'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: tsnet/go.mod
          cache-dependency-path: tsnet/go.sum
      - run: npm ci
      - name: Verify remote desktop behavior
        run: npx vitest run test/remote-desktop.test.ts test/tsnet.test.ts test/remote-network.test.ts
      - run: npx tsc --noEmit -p tsconfig.remote.json
      - run: go test ./...
        working-directory: tsnet
      - name: Validate Apple release secrets
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          required=(CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_CONTENT APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID)
          for name in "${required[@]}"; do
            test -n "${!name}" || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Prepare Apple notarization key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.DESKTOP_APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.DESKTOP_APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
      - name: Prepare macOS signing keychain
        id: signing_keychain
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
        run: node scripts/prepare-macos-signing-keychain.mjs
      - name: Build signed and notarized macOS package
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: |
          node scripts/verify-target.mjs darwin arm64 --remote
          npm run prepare:tsnet
          npm run build:remote
          node scripts/prepare-remote-package.mjs
          npx --no-install electron-builder \
            --mac --arm64 --publish never \
            --config electron-builder.remote.cjs \
            --config.afterSign=scripts/notarize-macos.mjs
      - name: Sign, notarize, and staple the DMG
        env:
          CSC_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
        run: |
          dmg_path="dist/remote/tizhi-ai-desktop-mac-arm64.dmg"
          identity="$(security find-identity -v -p codesigning "$CSC_KEYCHAIN" | awk '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo "::error::Developer ID Application identity not found"; exit 1; }
          codesign --keychain "$CSC_KEYCHAIN" --sign "$identity" --timestamp --force "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$dmg_path"; then break; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            echo "stapler staple failed, waiting for Apple ticket propagation in $((attempt * 15))s (attempt $attempt/6)..."
            sleep $((attempt * 15))
          done
      - name: Verify signed and notarized app and DMG
        run: |
          app_path="dist/remote/mac-arm64/Tizhi AI Desktop.app"
          test -d "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          codesign --verify --verbose=2 dist/remote/tizhi-ai-desktop-mac-arm64.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 dist/remote/tizhi-ai-desktop-mac-arm64.dmg
          xcrun stapler validate dist/remote/tizhi-ai-desktop-mac-arm64.dmg
          unzip -q dist/remote/tizhi-ai-desktop-mac-arm64.zip -d "$RUNNER_TEMP/tizhi-remote-macos-zip"
          zip_app="$RUNNER_TEMP/tizhi-remote-macos-zip/Tizhi AI Desktop.app"
          codesign --verify --deep --strict --verbose=2 "$zip_app"
          spctl --assess --type execute --verbose=4 "$zip_app"
          xcrun stapler validate "$zip_app"
      - name: Write release metadata
        run: |
          printf '%s\n' "${{ github.sha }}" > dist/remote/COMMIT
          shasum -a 256 \
            dist/remote/tizhi-ai-desktop-mac-arm64.dmg \
            dist/remote/tizhi-ai-desktop-mac-arm64.zip \
            > dist/remote/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: tizhi-ai-desktop-macos-arm64
          retention-days: 30
          path: |
            dist/remote/tizhi-ai-desktop-mac-arm64.dmg
            dist/remote/tizhi-ai-desktop-mac-arm64.zip
            dist/remote/SHA256SUMS
            dist/remote/COMMIT
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ steps.signing_keychain.outputs.keychain }}
          SIGNING_CERTIFICATE: ${{ steps.signing_keychain.outputs.certificate }}
          SIGNING_KEYCHAIN_LIST: ${{ steps.signing_keychain.outputs.keychain_list }}
        run: |
          if [ -n "$SIGNING_KEYCHAIN_LIST" ] && [ -f "$SIGNING_KEYCHAIN_LIST" ]; then
            keychains=()
            while IFS= read -r keychain; do
              test -z "$keychain" || keychains+=("$keychain")
            done < "$SIGNING_KEYCHAIN_LIST"
            security list-keychains -d user -s "${keychains[@]}"
            rm -f "$SIGNING_KEYCHAIN_LIST"
          fi
          test -z "$SIGNING_KEYCHAIN" || security delete-keychain "$SIGNING_KEYCHAIN" || rm -f "$SIGNING_KEYCHAIN"
          test -z "$SIGNING_CERTIFICATE" || rm -f "$SIGNING_CERTIFICATE"
          test -z "$APPLE_API_KEY" || rm -f "$APPLE_API_KEY"
